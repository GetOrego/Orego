<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orego — Trade</title>
<meta name="theme-color" content="#0A0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0B0D; --panel:#111318; --panel-2:#171A20; --line:#22262D;
    --text:#F3F4F5; --muted:#8A9099; --muted-2:#585E67;
    --gold:#E8B84B; --gold-soft:rgba(232,184,75,0.12);
    --gain:#39D98A; --gain-soft:rgba(57,217,138,0.12);
    --loss:#FF6161; --loss-soft:rgba(255,97,97,0.12);
    --radius:18px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Inter', sans-serif;
    background:radial-gradient(1100px 500px at 85% -10%, rgba(232,184,75,0.06), transparent 60%), var(--ink);
    color:var(--text); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }
  .green{ color:var(--gain); } .red{ color:var(--loss); }

  .sidebar{
    position:fixed; left:0; top:0; width:246px; height:100vh; background:var(--panel);
    border-right:1px solid var(--line); padding:28px 20px; display:flex; flex-direction:column; z-index:20;
  }
  .logo{ display:flex; align-items:center; gap:12px; margin-bottom:38px; padding:0 6px; }
  .logo-mark{ width:40px; height:40px; }
  .logo-mark svg{ width:100%; height:100%; display:block; }
  .logo h2{ font-family:'Space Grotesk'; font-size:23px; font-weight:700; }
  .logo .sub{ font-size:10.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:1px; }
  .menu{ display:flex; flex-direction:column; gap:3px; }
  .menu-label{ font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.09em; padding:0 14px; margin:18px 0 8px; }
  .menu a{ display:flex; align-items:center; gap:12px; color:var(--muted); font-size:14px; font-weight:500; padding:10px 14px; border-radius:11px; }
  .menu a svg{ width:17px; height:17px; flex-shrink:0; }
  .menu a:hover{ background:var(--panel-2); color:var(--text); }
  .menu a.active{ background:var(--gold-soft); color:var(--gold); }
  .sidebar-foot{ margin-top:auto; padding-top:20px; border-top:1px solid var(--line); }
  .plan-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:14px; font-size:12px; color:var(--muted); }
  .plan-card strong{ display:block; color:var(--text); font-size:13px; margin-bottom:3px; }

  .main{ margin-left:246px; padding:34px 40px 60px; max-width:1000px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; margin-bottom:22px; }
  .back-link:hover{ color:var(--text); }
  .back-link svg{ width:14px; height:14px; }

  .head{ display:flex; align-items:center; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .asset-icon{ width:52px; height:52px; border-radius:14px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:15px; color:var(--gold); }
  .head h1{ font-family:'Space Grotesk'; font-size:22px; font-weight:600; }
  .head .sub{ font-size:13px; color:var(--muted); margin-top:2px; }
  .price-block{ margin-left:auto; text-align:right; }
  .price-block .price{ font-family:'Space Grotesk'; font-size:26px; font-weight:600; }
  .price-block .change{ font-size:13px; font-weight:600; margin-top:2px; }

  .grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:start; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:24px; }
  .chart-figure svg{ width:100%; height:180px; display:block; }
  .stat-row{ display:flex; justify-content:space-between; padding:12px 0; border-top:1px solid var(--line); font-size:13px; }
  .stat-row:first-of-type{ border-top:none; margin-top:14px; }
  .stat-row .label{ color:var(--muted); }
  .stat-row .value{ font-family:'IBM Plex Mono'; }

  .trade-panel .tabs{ display:flex; background:var(--panel-2); border-radius:12px; padding:4px; margin-bottom:20px; }
  .tab-btn{ flex:1; border:none; background:none; padding:10px; border-radius:9px; color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; }
  .tab-btn.active{ background:var(--gold); color:#0A0B0D; }
  .tab-btn.sell-active{ background:var(--loss); color:#fff; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:7px; font-weight:500; }
  .qty-input{ display:flex; align-items:center; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  .qty-input button{ width:42px; height:44px; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .qty-input button:hover{ color:var(--text); }
  .qty-input input{ flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; text-align:center; font-family:'IBM Plex Mono'; }

  .summary{ background:var(--panel-2); border-radius:12px; padding:14px 16px; margin-bottom:18px; font-size:13px; }
  .summary-row{ display:flex; justify-content:space-between; padding:5px 0; color:var(--muted); }
  .summary-row.total{ color:var(--text); font-weight:600; border-top:1px solid var(--line); margin-top:5px; padding-top:10px; }

  .btn{ width:100%; padding:14px; border-radius:11px; font-size:14.5px; font-weight:600; border:none; cursor:pointer; }
  .btn-buy{ background:var(--gold); color:#0A0B0D; }
  .btn-buy:hover{ background:#f0c563; }
  .btn-sell{ background:var(--loss); color:#fff; }
  .btn-sell:hover{ background:#ff7a7a; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .msg{ font-size:12.5px; margin-top:12px; text-align:center; min-height:16px; }
  .msg.error{ color:var(--loss); } .msg.success{ color:var(--gain); }

  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--gain); color:var(--text);
    padding:14px 22px; border-radius:12px; font-size:13.5px; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:50; display:flex; align-items:center; gap:10px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg{ width:16px; height:16px; color:var(--gain); flex-shrink:0; }

  @media (max-width:900px){
    .sidebar{ position:relative; width:100%; height:auto; padding:18px 20px; }
    .sidebar-foot{ display:none; }
    .menu{ flex-direction:row; flex-wrap:wrap; }
    .menu-label{ display:none; }
    .logo{ margin-bottom:14px; }
    .menu{ border-top:1px solid var(--line); padding-top:12px; margin-top:2px; }
    .main{ margin-left:0; padding:26px 20px 50px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <a class="logo" href="index.html" style="text-decoration:none; color:inherit;">
    <div class="logo-mark">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M14.4,12.5 A15,15 0 0,1 38.5,27.9" stroke="#F3F4F5" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M14.4,35.5 A15,15 0 0,0 38.5,20.1" stroke="#F3F4F5" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M14.4,15.5 L14.4,32.5 Q14.4,35.5 16.95,33.92 L30.45,25.58 Q33,24 30.45,22.42 L16.95,14.08 Q14.4,12.5 14.4,15.5 Z" fill="#F3F4F5"/>
      </svg>
    </div>
    <div><h2>OREGO</h2><div class="sub">Portfolio</div></div>
  </a>

  <a href="index.html" class="back-home" style="display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; font-weight:500; margin-bottom:18px; padding:0 14px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M19 12H5M5 12l6-6M5 12l6 6"/></svg>
    Back to Home
  </a>
  <nav class="menu">
    <div class="menu-label">Overview</div>
    <a href="orego-refined.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
    <a href="orego-portfolio.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 7v12a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/></svg>Portfolio</a>
    <a href="orego-market.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>Market</a>
    <div class="menu-label">Manage</div>
    <a href="orego-assets.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Assets</a>
    <a href="orego-transactions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l6 6v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M13 3v6h6"/></svg>Transactions</a>
    <a href="orego-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</a>
  </nav>
  <div class="sidebar-foot">
    <div class="plan-card"><strong>Demo Mode</strong>Simulated trades — no real money moves.</div>
  </div>
</div>

<div class="main" id="page-content"></div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toast-msg"></span>
</div>

<script src="orego-engine.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const symbol = (params.get('symbol') || 'AAPL').toUpperCase();
  const asset = OregoEngine.getAsset(symbol);

  if(!asset){
    document.getElementById('page-content').innerHTML = `
      <a class="back-link" href="orego-market.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back to Market</a>
      <div class="panel"><p>We couldn't find that asset. <a href="orego-market.html" style="color:var(--gold);">Browse the market →</a></p></div>`;
  } else {
    let mode = 'buy';
    let qty = 1;

    document.getElementById('page-content').innerHTML = `
      <a class="back-link" href="orego-market.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back to Market</a>
      <div class="head">
        <div class="asset-icon">${asset.symbol.slice(0,2)}</div>
        <div>
          <h1>${asset.name}</h1>
          <div class="sub">${asset.symbol} · ${asset.class}</div>
        </div>
        <div class="price-block">
          <div class="price num">${OregoEngine.formatMoney(asset.price)}</div>
          <div class="change num ${asset.change>=0?'green':'red'}">${asset.change>=0?'+':''}${asset.change.toFixed(2)}% today</div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="chart-figure">
            <svg viewBox="0 0 500 180" preserveAspectRatio="none">
              <defs>
                <linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="${asset.change>=0?'#39D98A':'#FF6161'}" stop-opacity="0.28"/>
                  <stop offset="100%" stop-color="${asset.change>=0?'#39D98A':'#FF6161'}" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path d="${genPath(asset.change>=0)}" fill="url(#fillg)"/>
              <path d="${genPath(asset.change>=0, true)}" fill="none" stroke="${asset.change>=0?'#39D98A':'#FF6161'}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="stat-row"><span class="label">Buying power available</span><span class="value" id="bp-display"></span></div>
          <div class="stat-row"><span class="label">Your holdings</span><span class="value" id="holding-display"></span></div>
          <div class="stat-row"><span class="label">Market</span><span class="value">Simulated · delayed</span></div>
        </div>

        <div class="panel trade-panel">
          <div class="tabs">
            <button class="tab-btn active" id="tab-buy">Buy</button>
            <button class="tab-btn" id="tab-sell">Sell</button>
          </div>
          <div class="field">
            <label for="qty">Quantity (${asset.class === 'Crypto' ? 'coins' : 'shares'})</label>
            <div class="qty-input">
              <button type="button" id="qty-dec">−</button>
              <input type="number" id="qty" value="1" min="0" step="${asset.class==='Crypto'?'0.01':'1'}">
              <button type="button" id="qty-inc">+</button>
            </div>
          </div>
          <div class="summary">
            <div class="summary-row"><span>Est. price</span><span class="num" id="sum-price"></span></div>
            <div class="summary-row total"><span>Est. total</span><span class="num" id="sum-total"></span></div>
          </div>
          <button class="btn btn-buy" id="submit-btn">Review Buy</button>
          <div class="msg" id="msg"></div>
        </div>
      </div>
    `;

    function genPath(up, lineOnly){
      const pts = up
        ? [140,120,132,95,110,70,55,68,20]
        : [40,60,50,80,65,95,120,105,150];
      const xs = [0,62,125,187,250,312,375,437,500];
      const line = xs.map((x,i)=>`${x},${pts[i]}`).join(' L');
      return lineOnly ? `M${line}` : `M${line} L500,180 L0,180 Z`;
    }

    const state = () => OregoEngine.getState();
    function refreshStats(){
      const s = state();
      document.getElementById('bp-display').textContent = OregoEngine.formatMoney(s.buyingPower);
      const h = s.holdings[symbol];
      document.getElementById('holding-display').textContent = h ? `${OregoEngine.formatQty(h.qty)} ${symbol}` : `0 ${symbol}`;
    }
    function refreshSummary(){
      const q = parseFloat(document.getElementById('qty').value) || 0;
      qty = q;
      document.getElementById('sum-price').textContent = OregoEngine.formatMoney(asset.price);
      document.getElementById('sum-total').textContent = OregoEngine.formatMoney(asset.price * q);
    }

    document.getElementById('qty-dec').onclick = ()=>{
      const i = document.getElementById('qty');
      i.value = Math.max(0, (parseFloat(i.value)||0) - 1);
      refreshSummary();
    };
    document.getElementById('qty-inc').onclick = ()=>{
      const i = document.getElementById('qty');
      i.value = (parseFloat(i.value)||0) + 1;
      refreshSummary();
    };
    document.getElementById('qty').addEventListener('input', refreshSummary);

    document.getElementById('tab-buy').onclick = ()=> setMode('buy');
    document.getElementById('tab-sell').onclick = ()=> setMode('sell');

    function setMode(m){
      mode = m;
      document.getElementById('tab-buy').classList.toggle('active', m==='buy');
      document.getElementById('tab-sell').classList.toggle('sell-active', m==='sell');
      const btn = document.getElementById('submit-btn');
      btn.textContent = m === 'buy' ? 'Review Buy' : 'Review Sell';
      btn.className = 'btn ' + (m==='buy' ? 'btn-buy' : 'btn-sell');
      document.getElementById('msg').textContent = '';
    }

    document.getElementById('submit-btn').onclick = ()=>{
      const q = parseFloat(document.getElementById('qty').value) || 0;
      const result = mode === 'buy' ? OregoEngine.buy(symbol, q) : OregoEngine.sell(symbol, q);
      const msg = document.getElementById('msg');
      if(!result.ok){
        msg.textContent = result.reason;
        msg.className = 'msg error';
        return;
      }
      msg.textContent = '';
      refreshStats();
      showToast(`${mode==='buy'?'Bought':'Sold'} ${OregoEngine.formatQty(q)} ${symbol} at ${OregoEngine.formatMoney(asset.price)}`);
    };

    function showToast(text){
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = text;
      t.classList.add('show');
      setTimeout(()=> t.classList.remove('show'), 3200);
    }

    refreshStats();
    refreshSummary();
  }
</script>
</body>
</html>
