<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orego — Transactions</title>
<meta name="theme-color" content="#0A0B0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0B0D; --panel:#111318; --panel-2:#171A20; --line:#22262D;
    --text:#F3F4F5; --muted:#8A9099; --muted-2:#585E67;
    --gold:#E8B84B; --gold-soft:rgba(232,184,75,0.12);
    --gain:#39D98A; --gain-soft:rgba(57,217,138,0.12);
    --loss:#FF6161; --loss-soft:rgba(255,97,97,0.12);
    --radius:18px;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Inter', sans-serif;
    background:radial-gradient(1100px 500px at 85% -10%, rgba(232,184,75,0.06), transparent 60%), var(--ink);
    color:var(--text); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  .num{ font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }
  .green{ color:var(--gain); } .red{ color:var(--loss); }

  .sidebar{ position:fixed; left:0; top:0; width:246px; height:100vh; background:var(--panel); border-right:1px solid var(--line); padding:28px 20px; display:flex; flex-direction:column; z-index:20; }
  .logo{ display:flex; align-items:center; gap:12px; margin-bottom:14px; padding:0 6px; }
  .logo-mark{ width:40px; height:40px; }
  .logo-mark svg{ width:100%; height:100%; display:block; }
  .logo h2{ font-family:'Space Grotesk'; font-size:23px; font-weight:700; }
  .logo .sub{ font-size:10.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:1px; }
  .back-home{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; font-weight:500; margin-bottom:18px; padding:0 14px; }
  .menu{ display:flex; flex-direction:column; gap:3px; border-top:1px solid var(--line); padding-top:12px; margin-top:2px; }
  .menu-label{ font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.09em; padding:0 14px; margin:14px 0 8px; }
  .menu-label:first-child{ margin-top:0; }
  .menu a{ display:flex; align-items:center; gap:12px; color:var(--muted); font-size:14px; font-weight:500; padding:10px 14px; border-radius:11px; position:relative; }
  .menu a svg{ width:17px; height:17px; flex-shrink:0; }
  .menu a:hover{ background:var(--panel-2); color:var(--text); }
  .menu a.active{ background:var(--gold-soft); color:var(--gold); }

  .main{ margin-left:246px; padding:34px 40px 60px; max-width:1240px; }
  .eyebrow{ font-size:11px; color:var(--gold); letter-spacing:.1em; text-transform:uppercase; font-weight:600; margin-bottom:6px; }
  h1{ font-family:'Space Grotesk'; font-size:24px; font-weight:600; }
  .lead{ font-size:13px; color:var(--muted); margin-top:5px; margin-bottom:28px; }

  .table-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .t-row{ display:grid; grid-template-columns:1.6fr 0.8fr 1fr 1fr 1fr; gap:12px; padding:16px 22px; border-top:1px solid var(--line); align-items:center; }
  .t-row:first-child{ border-top:none; color:var(--muted-2); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:14px 22px; }
  .t-asset{ display:flex; align-items:center; gap:12px; }
  .t-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .t-icon svg{ width:14px; height:14px; }
  .t-name{ font-size:13.5px; font-weight:600; }
  .t-sub{ font-size:11.5px; color:var(--muted-2); margin-top:1px; }
  .t-side{ font-size:12px; font-weight:600; padding:4px 10px; border-radius:7px; width:fit-content; text-transform:capitalize; }
  .empty{ padding:50px 22px; text-align:center; color:var(--muted); }
  .empty a{ color:var(--gold); font-weight:600; }

  @media (max-width:760px){
    .t-row{ grid-template-columns:1.6fr 0.9fr 1fr; gap:8px; padding:14px 16px; }
    .t-row span:nth-child(4), .t-row span:nth-child(5){ display:none; }
  }
  @media (max-width:900px){
    .sidebar{ position:relative; width:100%; height:auto; padding:18px 20px; }
    .menu{ flex-direction:row; flex-wrap:wrap; }
    .menu-label{ display:none; }
    .main{ margin-left:0; padding:26px 20px 50px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <a class="logo" href="index.html" style="text-decoration:none; color:inherit;">
    <div class="logo-mark">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M14.4,12.5 A15,15 0 0,1 38.5,27.9" stroke="#F3F4F5" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M14.4,35.5 A15,15 0 0,0 38.5,20.1" stroke="#F3F4F5" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M14.4,15.5 L14.4,32.5 Q14.4,35.5 16.95,33.92 L30.45,25.58 Q33,24 30.45,22.42 L16.95,14.08 Q14.4,12.5 14.4,15.5 Z" fill="#FFC107"/>
      </svg>
    </div>
    <div><h2>OREGO</h2><div class="sub">Portfolio</div></div>
  </a>
  <a href="index.html" class="back-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M19 12H5M5 12l6-6M5 12l6 6"/></svg>
    Back to Home
  </a>
  <nav class="menu">
    <div class="menu-label">Overview</div>
    <a href="orego-refined.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
    <a href="orego-portfolio.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 7v12a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/></svg>Portfolio</a>
    <a href="orego-market.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>Market</a>
    <div class="menu-label">Manage</div>
    <a href="orego-assets.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Assets</a>
    <a href="orego-transactions.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l6 6v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M13 3v6h6"/></svg>Transactions</a>
    <a href="orego-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</a>
  </nav>
</div>

<div class="main">
  <div class="eyebrow">Manage</div>
  <h1>Transactions</h1>
  <p class="lead">Full history of your simulated buy and sell orders.</p>

  <div class="table-wrap">
    <div class="t-row">
      <span>Asset</span><span>Side</span><span>Qty</span><span>Price</span><span>Total</span>
    </div>
    <div id="tx-list"></div>
  </div>
</div>

<script src="orego-engine.js"></script>
<script>
  function renderTx(){
  const state = OregoEngine.getState();
  const list = document.getElementById('tx-list');

  if(state.transactions.length === 0){
    list.innerHTML = `<div class="empty">No transactions yet. <a href="orego-market.html">Place your first trade →</a></div>`;
  } else {
    list.innerHTML = state.transactions.map(t=>{
      const asset = OregoEngine.getAsset(t.symbol);
      const isBuy = t.side === 'buy';
      const total = t.price * t.qty;
      return `
        <a class="t-row" href="orego-trade.html?symbol=${t.symbol}" style="text-decoration:none; cursor:pointer;">
          <div class="t-asset">
            <div class="t-icon" style="background:${isBuy?'var(--gain-soft)':'var(--loss-soft)'}; color:${isBuy?'var(--gain)':'var(--loss)'};">
              ${isBuy
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>'}
            </div>
            <div>
              <div class="t-name">${asset ? asset.name : t.symbol}</div>
              <div class="t-sub">${t.symbol} · ${OregoEngine.timeAgo(t.time)}</div>
            </div>
          </div>
          <span class="t-side" style="background:${isBuy?'var(--gain-soft)':'var(--loss-soft)'}; color:${isBuy?'var(--gain)':'var(--loss)'};">${t.side}</span>
          <span class="num">${OregoEngine.formatQty(t.qty)}</span>
          <span class="num">${OregoEngine.formatMoney(t.price)}</span>
          <span class="num" style="font-weight:600;">${OregoEngine.formatMoney(total)}</span>
        </a>`;
    }).join('');
  }
  }

  renderTx();
  Promise.all([OregoEngine.fetchLiveCryptoPrices(), OregoEngine.fetchLiveStockPrices()]).then(([c,s]) => { if(c.ok || s.ok) renderTx(); });
</script>
</body>
</html>
